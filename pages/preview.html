<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intelligence Platform — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#06080d;--ink2:#0c0f16;--ink3:#11151e;--ink4:#171c28;
  --rule:rgba(255,255,255,.06);--rule2:rgba(255,255,255,.1);
  --white:#eef0f5;--fog:#7a8599;--ghost:#3d4a60;
  --acc:#2ec4b6;--acc-dim:rgba(46,196,182,.12);--acc-glow:rgba(46,196,182,.2);--acc-soft:rgba(46,196,182,.08);
  --coral:#e85d4a;--gold:#c8a96e;--violet:#9b72e8;--sapph:#4a7fe8;--agri:#4caf78;
  --ff-serif:'DM Serif Display',Georgia,serif;
  --ff-body:'Inter',system-ui,sans-serif;
  --ff-mono:'JetBrains Mono',monospace;
  --r:6px;--r2:10px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--ff-body);background:var(--ink);color:var(--white);-webkit-font-smoothing:antialiased}

/* ── Top nav ── */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:13px 28px;background:var(--ink2);border-bottom:1px solid var(--rule2);position:sticky;top:0;z-index:20}
.logo{font-family:var(--ff-serif);font-size:16px;color:var(--white)}
.preview-badge{font-family:var(--ff-mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;background:rgba(200,169,110,.12);border:1px solid rgba(200,169,110,.25);border-radius:20px;color:#c8a96e}
.login-link{padding:7px 16px;background:var(--white);border:none;border-radius:var(--r);font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}

/* ── Preview banner ── */
.preview-banner{background:rgba(200,169,110,.06);border-bottom:1px solid rgba(200,169,110,.13);padding:9px 28px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:#c8a96e;font-family:var(--ff-mono)}

/* ── Vertical switcher ── */
.vert-tabs{display:flex;gap:0;border-bottom:1px solid var(--rule2);background:var(--ink2);padding:0 28px;overflow-x:auto;scrollbar-width:none}
.vert-tabs::-webkit-scrollbar{display:none}
.vtab{display:flex;align-items:center;gap:7px;padding:12px 18px;font-size:12px;color:var(--fog);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--ff-body)}
.vtab:hover{color:var(--white)}
.vtab.active{color:var(--white);border-bottom-color:var(--acc)}
.vtab-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── Workspace shell ── */
.workspace{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 115px)}

/* sidebar */
.sidebar{background:var(--ink2);border-right:1px solid var(--rule2);display:flex;flex-direction:column;position:sticky;top:88px;height:calc(100vh - 88px);overflow-y:auto}
.sidebar-top{padding:18px 16px 14px;border-bottom:1px solid var(--rule)}
.vpill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--acc-dim);border:1px solid var(--acc-glow);border-radius:20px;font-family:var(--ff-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc);margin-bottom:9px}
.vdot{width:5px;height:5px;border-radius:50%;background:var(--acc);flex-shrink:0}
.sidebar-title{font-family:var(--ff-serif);font-size:15px;color:var(--white);line-height:1.3;margin-bottom:2px}
.sidebar-sub{font-size:10.5px;color:var(--fog)}
.nav{padding:10px 8px;flex:1}
.nav-label{font-family:var(--ff-mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ghost);padding:8px 8px 4px;display:block}
.ni{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);font-size:12px;color:var(--fog);cursor:pointer;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left;font-family:var(--ff-body)}
.ni:hover{background:rgba(255,255,255,.04);color:var(--white)}
.ni.active{background:var(--acc-soft);color:var(--acc);font-weight:500}
.ni .ic{font-size:13px;width:17px;text-align:center;flex-shrink:0}
.ni .badge{margin-left:auto;font-family:var(--ff-mono);font-size:9px;padding:1px 6px;background:var(--acc-dim);border-radius:10px;color:var(--acc)}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--rule)}
.u-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.u-av{width:28px;height:28px;border-radius:50%;background:var(--acc-dim);border:1px solid var(--acc-glow);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--acc);flex-shrink:0}
.u-name{font-size:11.5px;font-weight:500;color:var(--white)}
.u-role{font-family:var(--ff-mono);font-size:9px;color:var(--fog)}

/* ── Main area ── */
.main-area{display:flex;flex-direction:column;min-height:0}
.topbar{padding:12px 24px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;background:var(--ink);position:sticky;top:88px;z-index:5}
.topbar-title{font-size:13.5px;font-weight:500}
.role-badge{padding:3px 9px;border-radius:20px;font-family:var(--ff-mono);font-size:9px;letter-spacing:.7px;text-transform:uppercase}
.rb-head{background:rgba(200,169,110,.12);color:#c8a96e;border:1px solid rgba(200,169,110,.2)}
.content{padding:20px 24px;display:flex;flex-direction:column;gap:18px}

/* ── KPI strip ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{padding:16px 18px;background:var(--ink2);border:1px solid var(--rule2);border-radius:var(--r2);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc);opacity:.55}
.kpi-val{font-size:22px;font-weight:600;color:var(--white);margin-bottom:3px;font-family:var(--ff-mono)}
.kpi-label{font-size:10.5px;color:var(--fog);letter-spacing:.2px}
.kpi-delta{font-size:10px;margin-top:5px;font-family:var(--ff-mono);color:var(--acc)}

/* ── Section card ── */
.section{background:var(--ink2);border:1px solid var(--rule2);border-radius:var(--r2);overflow:hidden}
.section-head{padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-title{font-size:12.5px;font-weight:600}
.section-desc{font-size:11px;color:var(--fog);margin-top:1px}

/* ── Report table ── */
.report-table{width:100%;border-collapse:collapse}
.report-table th{font-family:var(--ff-mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--fog);padding:9px 18px;text-align:left;border-bottom:1px solid var(--rule)}
.report-table td{padding:10px 18px;font-size:12px;border-bottom:1px solid var(--rule);vertical-align:middle}
.report-table tr:last-child td{border-bottom:none}
.stage-pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-family:var(--ff-mono);font-size:9px}
.s-draft{background:rgba(61,74,96,.3);color:#7a8599;border:1px solid rgba(61,74,96,.4)}
.s-submitted{background:rgba(74,127,232,.1);color:#4a7fe8;border:1px solid rgba(74,127,232,.2)}
.s-senior_review{background:rgba(155,114,232,.1);color:#9b72e8;border:1px solid rgba(155,114,232,.2)}
.s-approved{background:rgba(142,212,74,.1);color:#8ed44a;border:1px solid rgba(142,212,74,.2)}
.s-published{background:rgba(76,255,145,.1);color:#4cff91;border:1px solid rgba(76,255,145,.2)}
.p-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
.ph{background:#e85d4a}.pm{background:#c8a96e}.pl{background:#3d4a60}
.btn-sm{padding:4px 10px;border:none;border-radius:var(--r);font-size:10.5px;cursor:default;font-family:var(--ff-body)}
.btn-approve{background:var(--acc-dim);border:1px solid var(--acc-glow);color:var(--acc)}
.btn-reject{background:rgba(232,93,74,.08);border:1px solid rgba(232,93,74,.2);color:#e85d4a}
.btn-publish{background:rgba(200,169,110,.12);border:1px solid rgba(200,169,110,.25);color:#c8a96e}
.btn-primary{padding:6px 14px;background:var(--acc);border:none;border-radius:var(--r);font-size:11.5px;font-weight:600;color:var(--ink);cursor:default;font-family:var(--ff-body)}

/* ── Factsheet cards ── */
.fs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:14px}
.fs-card{padding:14px;background:var(--ink3);border:1px solid var(--rule2);border-radius:var(--r2)}
.fs-status{font-family:var(--ff-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;color:var(--acc)}
.fs-title{font-size:12.5px;font-weight:500;margin-bottom:4px;line-height:1.4}
.fs-sub{font-size:11px;color:var(--fog);line-height:1.5;margin-bottom:9px}
.fs-metrics{display:flex;gap:14px;flex-wrap:wrap}
.fm-val{font-family:var(--ff-mono);font-size:13px;font-weight:500;color:var(--acc)}
.fm-lbl{font-size:9px;color:var(--fog);margin-top:1px}

/* ── Data sources ── */
.src-row{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--rule)}
.src-row:last-child{border-bottom:none}
.src-left{display:flex;align-items:center;gap:9px}
.src-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.live{background:#4cff91;box-shadow:0 0 5px rgba(76,255,145,.4)}
.stale{background:#c8a96e}
.error{background:#e85d4a}
.src-name{font-size:12px}
.src-tier{font-family:var(--ff-mono);font-size:8.5px;color:var(--fog);padding:1px 5px;background:rgba(255,255,255,.04);border-radius:3px;margin-left:3px}
.src-meta{font-size:10.5px;color:var(--fog);font-family:var(--ff-mono)}

/* ════════════════════════════════════════════════════
   DELIVERABLES UPLOAD HUB — the new section
════════════════════════════════════════════════════ */
.deliv-tabs{display:flex;gap:0;border-bottom:1px solid var(--rule)}
.dtab{display:flex;align-items:center;gap:7px;padding:11px 18px;font-size:12px;color:var(--fog);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:var(--ff-body);white-space:nowrap}
.dtab:hover{color:var(--white)}
.dtab.active{color:var(--white);border-bottom-color:var(--acc)}
.dtab-icon{font-size:14px}
.dtab-label{font-weight:500}
.dtab-hint{font-family:var(--ff-mono);font-size:9px;color:var(--ghost);margin-left:2px}

.deliv-panel{display:none;padding:20px}
.deliv-panel.show{display:block}

/* upload zone */
.upzone{border:1.5px dashed var(--rule2);border-radius:var(--r2);padding:28px 20px;text-align:center;transition:border-color .2s,background .2s;cursor:pointer;position:relative}
.upzone:hover,.upzone.drag{border-color:var(--acc-glow);background:var(--acc-soft)}
.upzone-icon{font-size:30px;margin-bottom:10px}
.upzone-title{font-size:13px;font-weight:500;color:var(--white);margin-bottom:4px}
.upzone-sub{font-size:11.5px;color:var(--fog);margin-bottom:3px}
.upzone-formats{font-family:var(--ff-mono);font-size:10px;color:var(--ghost);letter-spacing:.5px}

/* upload meta form */
.meta-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mf-full{grid-column:1/-1}
.mf-label{font-family:var(--ff-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--fog);margin-bottom:5px;display:block}
.mf-input{width:100%;padding:8px 11px;background:var(--ink3);border:1.5px solid var(--rule2);border-radius:var(--r);font-size:12.5px;color:var(--white);font-family:var(--ff-body);outline:none}
.mf-input:focus{border-color:var(--acc)}
.mf-select{width:100%;padding:8px 11px;background:var(--ink3);border:1.5px solid var(--rule2);border-radius:var(--r);font-size:12.5px;color:var(--white);font-family:var(--ff-body);outline:none;cursor:pointer}
.mf-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.btn-cancel{padding:7px 14px;background:transparent;border:1px solid var(--rule2);border-radius:var(--r);font-size:12px;color:var(--fog);cursor:default;font-family:var(--ff-body)}

/* uploaded files list */
.uploaded-list{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.ufile{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--ink3);border:1px solid var(--rule2);border-radius:var(--r2)}
.ufile-icon{font-size:20px;flex-shrink:0}
.ufile-info{flex:1;min-width:0}
.ufile-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ufile-meta{font-size:10.5px;color:var(--fog);font-family:var(--ff-mono)}
.ufile-status{font-family:var(--ff-mono);font-size:9px;padding:2px 8px;border-radius:10px}
.us-attached{background:rgba(76,255,145,.08);color:#4cff91;border:1px solid rgba(76,255,145,.15)}
.us-review{background:var(--acc-dim);color:var(--acc);border:1px solid var(--acc-glow)}
.us-pending{background:rgba(200,169,110,.1);color:#c8a96e;border:1px solid rgba(200,169,110,.2)}

/* topline data table */
.topline-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tl-card{padding:14px;background:var(--ink3);border:1px solid var(--rule2);border-radius:var(--r2)}
.tl-card-title{font-family:var(--ff-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--fog);margin-bottom:10px}
.tl-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule)}
.tl-row:last-child{border-bottom:none}
.tl-metric{font-size:12px;color:var(--fog)}
.tl-value{font-family:var(--ff-mono);font-size:13px;font-weight:500;color:var(--white)}
.tl-delta{font-family:var(--ff-mono);font-size:10px;padding:1px 6px;border-radius:10px;margin-left:6px}
.tl-up{background:rgba(76,255,145,.08);color:#4cff91}
.tl-down{background:rgba(232,93,74,.08);color:#e85d4a}
/* data age badges */
.age-badge{font-family:var(--ff-mono);font-size:9px;padding:1px 7px;border-radius:10px;font-weight:600;vertical-align:middle}
.age-fresh{background:rgba(76,255,145,.1);color:#4cff91;border:1px solid rgba(76,255,145,.2)}
.age-recent{background:rgba(46,196,182,.1);color:var(--acc);border:1px solid var(--acc-glow)}
.age-moderate{background:rgba(200,169,110,.1);color:#c8a96e;border:1px solid rgba(200,169,110,.2)}
.age-stale{background:rgba(232,93,74,.08);color:#e85d4a;border:1px solid rgba(232,93,74,.18)}
.age-old{background:rgba(155,114,232,.1);color:#9b72e8;border:1px solid rgba(155,114,232,.2)}
.ufile-datechip{font-family:var(--ff-mono);font-size:9.5px;color:var(--fog)}

/* hint boxes */
.info-box{padding:12px 14px;background:var(--acc-soft);border:1px solid var(--acc-dim);border-radius:var(--r2);font-size:11.5px;color:var(--fog);line-height:1.6;margin-bottom:14px}
.info-box strong{color:var(--white)}

/* deliverable type tag */
.dtype-tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font-family:var(--ff-mono);font-size:9px;letter-spacing:.5px;font-weight:600}
.dt-report{background:rgba(74,127,232,.1);color:#4a7fe8;border:1px solid rgba(74,127,232,.2)}
.dt-model{background:rgba(76,175,120,.1);color:#4caf78;border:1px solid rgba(76,175,120,.2)}
.dt-deck{background:rgba(155,114,232,.1);color:#9b72e8;border:1px solid rgba(155,114,232,.2)}
.dt-data{background:rgba(200,169,110,.1);color:#c8a96e;border:1px solid rgba(200,169,110,.2)}

@media(max-width:860px){
  .workspace{grid-template-columns:1fr}
  .sidebar{display:none}
  .kpi-row{grid-template-columns:1fr 1fr}
  .meta-form{grid-template-columns:1fr}
  .topline-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- top nav -->
<div class="topnav">
  <div class="logo">Intelligence Platform</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="preview-badge">Preview Mode</span>
    <a href="/" class="login-link">Sign in →</a>
  </div>
</div>

<!-- banner -->
<div class="preview-banner">
  <span>👁</span>
  <span>READ-ONLY PREVIEW — Showcasing all 6 intelligence verticals and deliverable upload structure. Sign in to access live data.</span>
</div>

<!-- vertical switcher -->

  <button class="vtab" onclick="switchVert('pharma',this)"><span class="vtab-dot" style="background:#d47ccc"></span>Pharma</button>
  <button class="vtab" onclick="switchVert('markets',this)"><span class="vtab-dot" style="background:#c8a96e"></span>Markets</button>
  <button class="vtab" onclick="switchVert('packaging',this)"><span class="vtab-dot" style="background:#e85d4a"></span>Packaging</button>
  <button class="vtab" onclick="switchVert('startups',this)"><span class="vtab-dot" style="background:#9b72e8"></span>Startups</button>
</div>

<div id="workspaceRoot"></div>

<script>
/* ══════════════════════════════════════════════════════

══════════════════════════════════════════════════════ */
const V = {

      ],

      ],
    },
    topline:{

/* ══════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════ */
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function fmtDate(d){
  if(!d) return '—';
  return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function dataAge(asofVal){
  if(!asofVal) return '';
  const days = Math.floor((Date.now()-new Date(asofVal).getTime())/(1000*86400));
  if(days<0) return '<span class="age-badge age-fresh">Future</span>';
  if(days===0) return '<span class="age-badge age-fresh">Today</span>';
  if(days<=7) return `<span class="age-badge age-fresh">${days}d old</span>`;
  if(days<=30) return `<span class="age-badge age-recent">${days}d old</span>`;
  if(days<=90) return `<span class="age-badge age-moderate">${Math.round(days/7)}w old</span>`;
  if(days<=365) return `<span class="age-badge age-stale">${Math.round(days/30)}mo old</span>`;
  return `<span class="age-badge age-old">${(days/365).toFixed(1)}yr old</span>`;
}

const STAGE_LABELS = {draft:'Draft',submitted:'Submitted',senior_review:'Senior Review',
  senior_approved:'Sr. Approved',head_review:'Head Review',approved:'Approved',
  published:'Published',rejected:'Rejected'};

const DELIVERABLE_ICONS = {report:'📄',model:'📊',deck:'🎯',data:'🗃️'};
const DELIVERABLE_LABELS = {report:'Report',model:'Model',deck:'Deck',data:'Data'};
const FILE_ICONS = {docx:'📄',pdf:'📄',xlsx:'📊',xlsm:'📊',pptx:'🎯',csv:'🗃️',json:'🗃️'};

function fileIcon(name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  return FILE_ICONS[ext] || '📎';
}

function delivBadges(deliverables){
  if(!deliverables || !deliverables.length) return '<span style="font-size:10.5px;color:#3d4a60">None yet</span>';
  return deliverables.map(d=>`<span class="dtype-tag dt-${d}">${DELIVERABLE_LABELS[d]}</span>`).join(' ');
}

function stageActions(stage){
  if(stage==='published') return '<span style="font-size:10.5px;color:#3d4a60">—</span>';
  if(stage==='approved')  return '<button class="btn-sm btn-publish">Publish</button>';
  if(stage==='head_review') return '<button class="btn-sm btn-approve">Approve</button> <button class="btn-sm btn-reject">Reject</button>';
  if(stage==='senior_review') return '<button class="btn-sm btn-approve">Approve</button> <button class="btn-sm btn-reject">Reject</button>';
  if(stage==='submitted') return '<button class="btn-sm btn-approve">Take for Review</button>';
  if(stage==='draft')     return '<button class="btn-sm btn-approve">Submit</button>';
  return '—';
}

let activeDelivTab = 'report';

function switchDelivTab(key, el){
  activeDelivTab = key;
  el.closest('.section').querySelectorAll('.dtab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  el.closest('.section').querySelectorAll('.deliv-panel').forEach(p=>p.classList.remove('show'));
  el.closest('.section').querySelector('#dp-'+key).classList.add('show');
}
window.switchDelivTab = switchDelivTab;

function switchVert(key, btn){
  const vert = V[key];
  document.querySelectorAll('.vtab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.documentElement.style.setProperty('--acc', vert.acc);
  document.documentElement.style.setProperty('--acc-dim', `rgba(${vert.accRgb},.12)`);
  document.documentElement.style.setProperty('--acc-glow', `rgba(${vert.accRgb},.2)`);
  document.documentElement.style.setProperty('--acc-soft', `rgba(${vert.accRgb},.08)`);
  renderWorkspace(vert);
}
window.switchVert = switchVert;

function renderWorkspace(vert){
  const prio = {high:'ph',med:'pm',low:'pl'};
  const stageCls = s=>`stage-pill s-${s}`;

  const reportRows = vert.reports.map(r=>`
    <tr>
      <td><div style="font-weight:500;font-size:12px">${esc(r.title)}</div>
          <div style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">${delivBadges(r.deliverables)}</div></td>
      <td><span class="${stageCls(r.stage)}">${STAGE_LABELS[r.stage]}</span></td>
      <td><span class="p-dot ${prio[r.priority]||'pm'}"></span>${r.priority}</td>
      <td style="font-size:11px;color:#7a8599">${esc(r.author)}</td>

      <td>${stageActions(r.stage)}</td>

  const fsCards = vert.factsheets.map(f=>`
    <div class="fs-card">

      <div class="fs-title">${esc(f.title)}</div>
      <div class="fs-sub">${esc(f.sub)}</div>
      <div class="fs-metrics">${(f.metrics||[]).map(m=>`
        <div><div class="fm-val">${esc(m.v)}</div><div class="fm-lbl">${esc(m.l)}</div></div>`).join('')}</div>
    </div>`).join('');

  const srcRows = vert.sources.map(s=>`
    <div class="src-row">
      <div class="src-left">
        <span class="src-dot ${s.st}"></span>
        <span class="src-name">${esc(s.n)}</span>
        <span class="src-tier">${s.tier}</span>
      </div>
      <div class="src-meta">${s.meta}</div>
    </div>`).join('');

  const tl = vert.topline;
  const tlRows = tl.metrics.map(m=>`
    <div class="tl-row">
      <span class="tl-metric">${esc(m.metric)}</span>
      <span style="display:flex;align-items:center">
        <span class="tl-value">${esc(m.value)}</span>
        <span class="tl-delta tl-${m.dir}">${esc(m.delta)}</span>
      </span>
    </div>`).join('');

  document.getElementById('workspaceRoot').innerHTML = `

    <!-- sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="vpill"><span class="vdot"></span>${vert.label}</div>
        <div class="sidebar-title">Intelligence<br>Platform</div>

      </div>
      <nav class="nav">
        <span class="nav-label">Workspace</span>

        <button class="ni"         onclick="showSec('factsheets',this)"><span class="ic">📄</span>Factsheets</button>
        <button class="ni"         onclick="showSec('sources',this)"><span class="ic">🔗</span>Data Sources</button>
        <span class="nav-label" style="margin-top:8px">Deliverables</span>
        <button class="ni"         onclick="showSec('deliverables',this)"><span class="ic">📦</span>Upload Hub <span class="badge">${vert.kpis.deliverables}</span></button>

        <div class="u-row">
          <div class="u-av">H</div>
          <div>
            <div class="u-name">Head of Research</div>
            <div class="u-role">HEAD · ${vert.label.toUpperCase()}</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- main -->
    <div class="main-area">
      <div class="topbar">
        <div class="topbar-title" id="pageTitle">Dashboard — ${esc(vert.label)} Intelligence</div>
        <span class="role-badge rb-head">Head of Research</span>
      </div>
      <div class="content">

        <!-- Dashboard -->

          <div class="kpi-row">

            <div class="kpi"><div class="kpi-val">${vert.kpis.sources}</div><div class="kpi-label">Data Sources</div><div class="kpi-delta">Live feeds</div></div>
            <div class="kpi"><div class="kpi-val">${vert.kpis.deliverables}</div><div class="kpi-label">Deliverables</div><div class="kpi-delta">Reports+Models+Decks</div></div>

          <!-- topline snapshot on dashboard -->

            </div>
            <div style="padding:14px 18px">${tlRows}</div>

        </div>

        <!-- Reports -->
        <div id="sec-reports" style="display:none">

              <button class="btn-primary">+ New Report</button>
            </div>
            <div style="overflow-x:auto">
              <table class="report-table">
                <thead><tr><th>Title + Deliverables</th><th>Stage</th><th>Priority</th><th>Author</th><th>Updated</th><th>Actions</th></tr></thead>
                <tbody>${reportRows}</tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Factsheets -->
        <div id="sec-factsheets" style="display:none">
          <div class="section">
            <div class="section-head"><div class="section-title">Published Factsheets — ${esc(vert.label)}</div></div>
            <div class="fs-grid">${fsCards}</div>

        </div>

        <!-- Data Sources -->
        <div id="sec-sources" style="display:none">

            <div class="section-head"><div class="section-title">Data Sources — ${esc(vert.label)}</div></div>

        <!-- Deliverables Upload Hub -->
        <div id="sec-deliverables" style="display:none">

                <div class="section-title">Deliverables Upload Hub</div>
                <div class="section-desc">Four distinct deliverable types — each with its own upload form, metadata, and visibility controls</div>

            <!-- 4 deliverable tabs -->
            <div class="deliv-tabs">
              <button class="dtab active" onclick="switchDelivTab('report',this)">

              </button>
              <button class="dtab" onclick="switchDelivTab('deck',this)">
                <span class="dtab-icon">🎯</span><span class="dtab-label">Client Deck</span><span class="dtab-hint">PPTX</span>
              </button>
              <button class="dtab" onclick="switchDelivTab('data',this)">
                <span class="dtab-icon">🗃️</span><span class="dtab-label">Topline Data</span><span class="dtab-hint">CSV/JSON</span>
              </button>
            </div>
            <div id="dp-report" class="deliv-panel show">${delivPanel_report(vert.uploadedFiles.report)}</div>
            <div id="dp-model"  class="deliv-panel">${delivPanel_model(vert.uploadedFiles.model)}</div>
            <div id="dp-deck"   class="deliv-panel">${delivPanel_deck(vert.uploadedFiles.deck)}</div>
            <div id="dp-data"   class="deliv-panel">${delivPanel_data(vert, vert.uploadedFiles.data)}</div>
          </div>

        <!-- Topline Data view -->
        <div id="sec-topline" style="display:none">
          <div class="section">
            <div class="section-head">
              <div><div class="section-title">Published Topline Metrics</div><div class="section-desc">${esc(tl.geography)} — Powers front-end KPI cards, heatmaps, and comparison charts</div></div>
            </div>
            <div style="padding:16px 18px">
              <div style="font-family:var(--ff-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--fog);margin-bottom:12px">Live metrics · As of Nov 2026 · Source: uploaded CSV</div>
              ${tlRows}
              <div style="margin-top:16px;padding:12px;background:var(--ink3);border:1px solid var(--rule2);border-radius:var(--r2)">
                <div style="font-family:var(--ff-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--fog);margin-bottom:8px">Front-end usage of this data</div>

                  <span class="dtype-tag dt-data">KPI Cards</span>
                  <span class="dtype-tag dt-data">Heatmap</span>

                  <span class="dtype-tag dt-data">Geography Filter</span>
                  <span class="dtype-tag dt-data">Period Selector</span>

              </div>
            </div>
          </div>

/* section nav */
const SECTIONS = ['dashboard','reports','factsheets','sources','deliverables','topline'];
const TITLES = {dashboard:'Dashboard',reports:'Reports',factsheets:'Factsheets',sources:'Data Sources',deliverables:'Deliverables Upload Hub',topline:'Topline Data'};
function showSec(id, btn){
  SECTIONS.forEach(s=>{
    const el = document.getElementById('sec-'+s);
    if(el) el.style.display = s===id ? 'block':'none';
  });
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const pt = document.getElementById('pageTitle');
  if(pt) pt.textContent = TITLES[id] || id;
}
window.showSec = showSec;

/* init */
const vert0 = V['epi'];
document.documentElement.style.setProperty('--acc', vert0.acc);
document.documentElement.style.setProperty('--acc-dim', `rgba(${vert0.accRgb},.12)`);
document.documentElement.style.setProperty('--acc-glow', `rgba(${vert0.accRgb},.2)`);
document.documentElement.style.setProperty('--acc-soft', `rgba(${vert0.accRgb},.08)`);
renderWorkspace(vert0);
</script>
